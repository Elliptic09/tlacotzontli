<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tlacotzontli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#FBF8EE; --crema-2:#F3EDDC; --teal:#1F6B70; --teal-claro:#DCEBE8;
  --ocre:#C0864A; --ocre-claro:#F1E2CC; --obsidiana:#231F1B; --gris:#7A736A;
  --alerta:#C0352B; --jade:#3E8E5E;
  --page:#EFEAE0; --page-ink:#231F1B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1B1917;--page-ink:#EDE6DA}}
:root[data-theme="dark"]{--page:#1B1917;--page-ink:#EDE6DA}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-ink);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
.intro{max-width:1340px;margin:0 auto;padding:40px 24px 8px}
.intro h1{font-weight:600;font-size:1.6rem;margin:0 0 6px}
.intro p{margin:0;max-width:62ch;opacity:.75;font-size:.95rem;line-height:1.6}
.galeria{max-width:1340px;margin:0 auto;padding:28px 24px 40px;display:flex;flex-wrap:wrap;gap:36px 28px;justify-content:center}
figure{margin:0;width:300px;max-width:100%}
figcaption{margin-top:14px;font-size:.85rem;line-height:1.5;opacity:.8}
figcaption b{display:block;font-weight:600;opacity:1;font-size:.95rem;margin-bottom:2px}

/* Teléfono */
.tel{width:300px;max-width:100%;height:620px;border-radius:38px;background:var(--obsidiana);padding:9px;box-shadow:0 18px 40px -18px rgba(35,31,27,.45)}
.pantalla{position:relative;height:100%;border-radius:30px;overflow:hidden;background:var(--crema);color:var(--obsidiana);display:flex;flex-direction:column}
.status{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11px;font-weight:500}

/* Greca */
.greca{display:block;width:100%;height:18px;color:var(--ocre)}
.greca.tenue{opacity:.35}

/* Login */
.login{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 26px 0}
.login .logo{width:118px;margin-top:22px}
.wordmark{font-style:italic;font-weight:500;color:var(--teal);font-size:19px;margin:8px 0 2px;letter-spacing:.01em}
.lema{font-size:11.5px;color:var(--gris);margin:0 0 26px}
.campo{width:100%;margin-bottom:16px}
.campo label{display:block;font-size:11px;color:var(--teal);font-weight:500;margin-bottom:4px}
.campo div{border-bottom:1.5px solid var(--teal);padding:6px 0;font-size:13px;color:var(--gris);display:flex;justify-content:space-between}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:600 14px "Poppins",sans-serif;cursor:pointer}
.btn-pri{background:var(--teal);color:#fff;margin-top:10px}
.btn-sec{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.link{font-size:11.5px;color:var(--ocre);margin:10px 0 18px;font-weight:500}
.pie{margin-top:auto;width:calc(100% + 52px)}

/* Principal */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.top .hola{font-size:11px;color:var(--gris);line-height:1.2}
.top .nombre{font-size:14px;font-weight:600;line-height:1.2}
.campana{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--crema-2);display:grid;place-items:center}
.mapa{position:relative;flex:1;min-height:0}
.mapa svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin .avatar{width:32px;height:32px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);font-size:12px}
.pin::after{content:"";width:8px;height:8px;background:#fff;transform:rotate(45deg) translateY(-6px);box-shadow:2px 2px 3px rgba(0,0,0,.15)}
.hoja{background:var(--crema);border-radius:22px 22px 0 0;margin-top:-22px;position:relative;padding:8px 16px 0;box-shadow:0 -6px 16px rgba(35,31,27,.08)}
.asa{width:36px;height:4px;border-radius:2px;background:#D9D1C1;margin:0 auto 8px}
.hoja-tit{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hoja-tit h3{margin:0;font-size:14px;font-weight:600}
.agregar{border:0;background:var(--ocre-claro);color:#8A5A28;border-radius:10px;padding:6px 10px;font:600 11.5px "Poppins",sans-serif;display:flex;align-items:center;gap:4px}
.disp{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #ECE4D3}
.disp:last-child{border-bottom:0}
.disp .info{flex:1;min-width:0}
.disp .n{font-size:13px;font-weight:600}
.disp .e{font-size:11px;color:var(--gris);display:flex;gap:6px;align-items:center}
.chip{font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chip.casa{background:var(--teal-claro);color:var(--teal)}
.chip.fuera{background:var(--ocre-claro);color:#8A5A28}
.bat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:10.5px;color:var(--gris)}
.nav{flex:none;display:flex;justify-content:space-around;padding:8px 8px 14px;background:var(--crema);border-top:1px solid #ECE4D3}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--gris);padding:6px 9px;border-radius:14px}
.nav .activo{color:var(--teal);background:var(--teal-claro);font-weight:600}

/* Alerta */
.alerta{background:var(--alerta);color:#fff}
.alerta .status{color:#fff}
.al-cuerpo{flex:1;display:flex;flex-direction:column;padding:10px 20px 20px}
.pulso{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:14px auto 12px;position:relative}
.pulso::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:onda 1.8s ease-out infinite}
@keyframes onda{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulso::before{animation:none}}
.alerta h2{text-align:center;font-size:19px;font-weight:600;margin:0 0 4px;line-height:1.3}
.alerta .sub{text-align:center;font-size:12px;opacity:.85;margin:0 0 14px}
.mini{border-radius:16px;overflow:hidden;background:var(--crema);color:var(--obsidiana);position:relative}
.mini svg{display:block;width:100%;height:120px}
.mini .dir{padding:9px 12px;font-size:11.5px;line-height:1.4}
.mini .dir b{font-weight:600;font-size:12.5px;display:block}
.acciones{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.btn-blanco{background:#fff;color:var(--alerta)}
.btn-borde{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.fila{display:flex;gap:9px}

/* Zonas */
.encab{padding:6px 18px 0}
.encab h2{margin:0;font-size:20px;font-weight:600}
.encab p{margin:4px 0 12px;font-size:12px;color:var(--gris);line-height:1.5}
.lista{padding:0 18px;flex:1}
.zona{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ECE4D3}
.glifo{width:42px;height:42px;border-radius:12px;background:var(--ocre-claro);display:grid;place-items:center;flex:none;color:#8A5A28}
.zona .n{font-size:13px;font-weight:600}
.zona .e{font-size:11px;color:var(--gris)}
.switch{margin-left:auto;width:36px;height:21px;border-radius:12px;background:var(--teal);position:relative;flex:none}
.switch::after{content:"";position:absolute;right:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff}
.switch.off{background:#D9D1C1}.switch.off::after{right:auto;left:3px}
.vacio{margin:14px 18px 16px;border:1.5px dashed #D9C3A2;border-radius:16px;padding:14px;text-align:center;font-size:12px;color:var(--gris);line-height:1.5}
.vacio b{display:block;color:var(--obsidiana);font-weight:600;font-size:13px}


/* Alerta NFC */
.alerta.nfc{background:var(--ocre)}
.nfc .pulso{width:56px;height:56px;margin:6px auto 10px}.nfc .pulso svg{width:26px;height:26px}
.nfc .mini svg{height:80px}.nfc h2{font-size:17px}.nfc .acciones{gap:7px}.nfc .btn{padding:11px}
.alerta.nfc .btn-blanco{color:#8A5A28}
.quien{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;font-size:11.5px;line-height:1.45;margin-top:10px}
.quien b{font-weight:600}
/* Ajustes */
.aj{flex:1;overflow:hidden;padding:0 18px}
.aj h2{margin:6px 0 10px;font-size:20px;font-weight:600}
.selector{display:flex;align-items:center;gap:10px;background:var(--crema-2);border-radius:14px;padding:8px 10px;margin-bottom:12px}
.selector .n{font-size:13px;font-weight:600;flex:1}
.selector .avatar{width:28px;height:28px;font-size:11px}
.sec{font-size:11px;font-weight:600;color:var(--teal);margin:12px 0 6px}
.opciones{display:flex;gap:6px}
.op{flex:1;border:1.5px solid #E3D9C6;border-radius:12px;padding:8px 4px;text-align:center;font-size:10.5px;line-height:1.3;color:var(--gris)}
.op svg{display:block;margin:0 auto 4px}
.op.sel{border-color:var(--teal);background:var(--teal-claro);color:var(--teal);font-weight:600}
.fila-aj{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ECE4D3;font-size:12.5px}
.fila-aj .d{flex:1}
.fila-aj small{display:block;font-size:10.5px;color:var(--gris)}
.fila-aj .v{font-size:11px;color:var(--gris)}
.mini-btn{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:6px 10px;font:600 11px "Poppins",sans-serif}
.salir{display:block;text-align:center;font-size:12.5px;font-weight:600;color:var(--obsidiana);margin:12px 0 4px}

/* Paleta */
.paleta{max-width:1340px;margin:0 auto;padding:0 24px 56px}
.paleta h2{font-size:1.1rem;font-weight:600;margin:0 0 14px}
.muestras{display:flex;flex-wrap:wrap;gap:14px}
.muestra{width:150px}
.muestra i{display:block;height:56px;border-radius:12px;border:1px solid rgba(0,0,0,.08)}
.muestra span{display:block;font-size:.8rem;margin-top:6px;line-height:1.4}
.muestra small{opacity:.65}
.greca-demo{max-width:420px;margin-top:22px;color:var(--ocre)}

/* ---- Página para NFC/QR ---- */
body{min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
.banda{display:block;width:100%;height:18px;flex:none}
.galeria{flex:1;align-items:center;padding:28px 24px 24px}
@media (max-width:760px){
  .galeria{width:100%;max-width:100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;
    gap:18px;padding:24px calc(50vw - 150px) 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .galeria::-webkit-scrollbar{display:none}
  figure{flex:none;scroll-snap-align:center}
}
.puntos{display:none;justify-content:center;gap:7px;padding-bottom:6px}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--page-ink);opacity:.2;transition:.2s}
.puntos i.on{opacity:.8;width:18px;border-radius:4px}
@media (max-width:760px){.puntos{display:flex}}
.contacto{display:flex;justify-content:center;padding:14px 16px 26px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;text-decoration:none;
  font:600 16px "Poppins",sans-serif;padding:15px 28px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(31,107,112,.6)}
.cta:active{transform:scale(.98)}
</style>
</head>
